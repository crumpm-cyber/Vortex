<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌀</text></svg>">
</head>
<body class="app-page">
  <div id="app" class="app-layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-small">
          <span>🌀</span>
          <span>Vortex</span>
        </div>
        <button id="logout-btn" class="icon-btn" title="Log out">⏻</button>
      </div>

      <div class="sidebar-section">
        <div class="section-header">
          <span>DIRECT MESSAGES</span>
          <button id="new-dm-btn" class="icon-btn" title="New DM">+</button>
        </div>
        <div id="dm-list" class="chat-list"></div>
      </div>

      <div class="sidebar-section">
        <div class="section-header">
          <span>GROUP CHATS</span>
          <button id="new-group-btn" class="icon-btn" title="New Group">+</button>
        </div>
        <div id="group-list" class="chat-list"></div>
      </div>

      <div class="user-panel">
        <div class="user-info">
          <div id="user-avatar" class="avatar">?</div>
          <div class="user-details">
            <span id="current-username">User</span>
            <span id="user-status" class="status online">Online</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-area">
      <header class="chat-header">
        <div class="chat-title">
          <span id="chat-icon">#</span>
          <h2 id="chat-name">Select a chat</h2>
        </div>
        <div class="chat-actions">
          <button id="add-member-btn" class="icon-btn hidden" title="Add member">👤+</button>
        </div>
      </header>

      <div id="messages" class="messages">
        <div class="empty-state">
          <p>Select a conversation or start a new one</p>
        </div>
      </div>

      <div class="message-input-area">
        <form id="message-form" class="message-form">
          <input 
            type="text" 
            id="message-input" 
            placeholder="Message..." 
            autocomplete="off" 
            disabled 
          />
          <button type="submit" id="send-btn" class="btn btn-send" disabled>Send</button>
        </form>
      </div>
    </main>
  </div>

  <!-- New DM Modal -->
  <div id="dm-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Start a Direct Message</h3>
      <input type="text" id="dm-search" placeholder="Search by username..." />
      <div id="user-search-results" class="search-results"></div>
      <button id="close-dm-modal" class="btn btn-secondary">Cancel</button>
    </div>
  </div>

  <!-- New Group Modal -->
  <div id="group-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Create Group Chat</h3>
      <div class="form-group">
        <label>Group Name</label>
        <input type="text" id="group-name" placeholder="My Group" maxlength="30" />
      </div>
      <div class="form-group">
        <label>Add members (usernames, comma separated)</label>
        <input type="text" id="group-members" placeholder="user1, user2" />
      </div>
      <div class="modal-actions">
        <button id="create-group-btn" class="btn btn-primary">Create</button>
        <button id="close-group-modal" class="btn btn-secondary">Cancel</button>
      </div>
      <p id="group-error" class="error-msg"></p>
    </div>
  </div>

  <!-- Add Member Modal -->
  <div id="add-member-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Member to Group</h3>
      <input type="text" id="add-member-input" placeholder="Username" />
      <div class="modal-actions">
        <button id="confirm-add-member" class="btn btn-primary">Add</button>
        <button id="close-add-member" class="btn btn-secondary">Cancel</button>
      </div>
      <p id="add-member-error" class="error-msg"></p>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
